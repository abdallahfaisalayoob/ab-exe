[package]
name = "pu-core"
version = "0.1.0"
edition = "2021"
description = "Personal Universe core: local database, indexer, document extraction, backups"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
walkdir = "2"
rayon = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
tiny_http = { version = "0.12", optional = true }

[features]
dev-server = ["dep:tiny_http"]

[[bin]]
name = "pu-dev"
path = "src/bin/pu-dev.rs"
required-features = ["dev-server"]

[dev-dependencies]
rust_xlsxwriter = "0.102"
